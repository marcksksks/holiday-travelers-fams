name: Laravel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fams
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: fams_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fams"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate

      - name: Set test database env
        run: |
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=fams_testing" >> .env
          echo "DB_USERNAME=fams" >> .env
          echo "DB_PASSWORD=secret" >> .env

      - name: Directory permissions
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
          chmod -R u+rwX,g+rwX,o-rwx storage bootstrap/cache

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run test suite
        run: php artisan test

      - name: Lint changed PHP files (Pint, dry-run)
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE="HEAD^"
          else
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          mapfile -t PHP_FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.php'
          )

          if (( ${#PHP_FILES[@]} == 0 )); then
            echo "No changed PHP files to lint."
            exit 0
          fi

          printf 'Linting %d changed PHP file(s):\n' "${#PHP_FILES[@]}"
          printf '  %s\n' "${PHP_FILES[@]}"

          vendor/bin/pint --test -- "${PHP_FILES[@]}"
